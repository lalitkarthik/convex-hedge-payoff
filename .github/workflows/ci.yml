name: CI

# Path-filtered away from the frontend. `web/` carries no Python, so running ruff and
# 65 pytest cases against a CSS change is noise that trains people to ignore a red tick.
# A pull request touching both halves still runs this - `paths-ignore` only skips when
# *every* changed file matches.
on:
  pull_request:
    branches: [main]
    paths-ignore:
      - "web/**"
      - "docs/**"
      - "**.md"
  push:
    branches: [main]
    paths-ignore:
      - "web/**"
      - "docs/**"
      - "**.md"

# A second push to the same PR cancels the first - no point paying for a run
# whose result is already stale.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements-dev.txt
      - name: ruff
        run: ruff check .

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt -r requirements-dev.txt
      - name: pytest
        run: pytest
